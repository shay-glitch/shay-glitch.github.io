<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שי בריאות">
<meta name="theme-color" content="#090d12">
<link rel="manifest" href="manifest.json">
<title>שי בריאות</title>
<style>
  :root {
    --bg: #060a0d;
    --bg2: #111821;
    --panel: rgba(18,24,30,.92);
    --panel-2: rgba(14,19,25,.9);
    --panel-3: rgba(22,27,35,.9);
    --line: rgba(255,255,255,.08);
    --ink: #ecf5ff;
    --muted: #a7b3c0;
    --green: #4fe3a5;
    --green-deep: #87e9b7;
    --amber: #f6c45a;
    --red: #ff5f7c;
    --blue: #57b3ff;
    --purple: #8270ff;
    --shadow: 0 18px 44px rgba(0,0,0,.42);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background:
      radial-gradient(circle at 50% 0%, rgba(113,131,174,.24), transparent 28%),
      linear-gradient(180deg, #060a0d 0%, #0b1117 100%);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Arial, sans-serif;
  }

  body {
    display:flex; justify-content:center; align-items:flex-start;
    padding:16px;
  }

  .phone {
    width: min(100vw - 20px, 410px);
    min-height: 846px;
    background: linear-gradient(180deg, rgba(12,16,19,.96), rgba(7,10,13,1));
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  .portrait {
    position: relative;
    height: 640px;
    background:
      linear-gradient(180deg, rgba(13,17,22,.15), rgba(10,13,18,.78)),
      radial-gradient(circle at 52% 32%, rgba(152,155,158,.7), rgba(66,73,82,.25) 18%, transparent 32%),
      linear-gradient(90deg, rgba(49,55,62,.8) 0%, rgba(13,17,20,.82) 40%, rgba(34,40,48,.6) 100%);
  }

  .portrait::before {
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(255,255,255,.06), transparent 22%, transparent 78%, rgba(255,255,255,.05)),
      radial-gradient(circle at 60% 28%, rgba(188,191,196,.28), transparent 18%),
      linear-gradient(0deg, rgba(13,16,22,.25), transparent 32%);
  }

  .portrait::after {
    content:"";
    position:absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 24%, rgba(150,150,150,.2), transparent 20%),
      linear-gradient(90deg, transparent 0%, rgba(0,0,0,.3) 38%, rgba(0,0,0,.18) 100%);
  }

  .score-chip {
    position:absolute; left:20px; top:18px; z-index:3;
    background: rgba(0,0,0,.7);
    color: var(--ink);
    border-radius: 999px;
    min-width: 78px; height: 46px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.1);
    font-weight:800;
    font-size: 20px;
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
  }

  .title-top {
    position:absolute; top:22px; right:22px; z-index:3;
    text-align:right; font-weight:800; color: var(--ink);
    line-height:1.05;
  }
  .title-top .date { font-size: 13px; color: var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .title-top .name { font-size: 22px; letter-spacing:-.03em; }

  .mic {
    position:absolute; left: 50%; bottom: 118px; transform: translateX(-50%); width: 110px; height: 180px; z-index:2;
    border-radius: 0 0 90px 90px;
    background: linear-gradient(90deg, rgba(255,255,255,.08), rgba(70,76,84,.12));
    filter: blur(.2px);
    border-left: 3px solid rgba(255,255,255,.08);
    border-right: 3px solid rgba(255,255,255,.08);
  }
  .mic::before {
    content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:-8px; width:44px; height:140px; border-radius: 999px; background: linear-gradient(90deg, rgba(18,20,22,.8), rgba(52,60,68,.8));
    box-shadow: 0 0 0 2px rgba(255,255,255,.04);
  }
  .mic::after {
    content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:-18px; width:74px; height:24px; border-radius: 18px; background: rgba(30,35,41,.85);
  }

  .warning-box {
    position:absolute; right:18px; bottom:18px; z-index:3; background: rgba(0,0,0,.56); border:1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 12px 14px 10px; width: 160px;
  }
  .warning-box .label { color: var(--muted); font-size: 10px; letter-spacing:.06em; text-transform:uppercase; }
  .warning-box .big { font-size: 32px; font-weight: 900; margin-top: 6px; }
  .warning-box .small { color: var(--muted); font-size: 12px; }

  .info-block {
    position:absolute; left: 20px; bottom: 18px; z-index:3; width: calc(100% - 190px);
    color: var(--ink);
  }
  .info-block .q {
    font-size: 15px; line-height: 1.4; font-weight: 700; margin-bottom: 8px;
  }
  .info-block .q strong { font-size: 18px; }
  .info-block .line {
    font-size: 12px; letter-spacing: .04em; color: var(--muted);
  }

  .panel {
    position: relative;
    margin-top: -12px; z-index: 3;
    background: linear-gradient(180deg, rgba(17,22,28,.82), rgba(12,14,18,.96));
    border-top-left-radius: 26px; border-top-right-radius: 26px;
    border-top: 1px solid rgba(255,255,255,.09);
    padding: 14px 14px 90px;
  }

  .mini-card {
    background: linear-gradient(180deg, rgba(17,24,30,.9), rgba(12,15,20,.96));
    border:1px solid rgba(255,255,255,.08); border-radius: 24px; padding: 15px 16px 14px; margin-bottom: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
  }

  .mini-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
  .mini-head .t { color: var(--muted); font-size: 12px; text-transform:uppercase; letter-spacing:.08em; }
  .mini-head .v { font-size: 12px; font-weight:800; color: var(--ink); }

  .ring-wrap { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .ring-wrap .left { flex:1; }
  .ring-wrap .meta { font-size: 13px; color: var(--muted); line-height:1.8; }
  .ring {
    width: 118px; height: 118px; position:relative; border-radius:50%;
    background: conic-gradient(var(--green) 0 58%, rgba(255,255,255,.06) 58% 100%);
    display:grid; place-items:center;
  }
  .ring::before {
    content:""; position:absolute; inset:12px; border-radius:50%; background:#111821; border:1px solid rgba(255,255,255,.08);
  }
  .ring .value {
    position:relative; z-index: 1; font-weight: 900; font-size: 20px; color: var(--ink);
  }

  .stack {
    display:flex; justify-content:space-between; align-items:flex-start; gap: 10px; margin-top: 12px;
  }
  .stack .detail { flex:1; }
  .stack .detail .num { font-size: 17px; font-weight:800; }
  .stack .detail .sub { font-size: 12px; color: var(--muted); }
  .stack .pill {
    display:inline-flex; align-items:center; justify-content:center; height: 30px; min-width: 52px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06);
  }
  .stack .pill.green { background: rgba(79,227,165,.12); color: var(--green); }
  .stack .pill.amber { background: rgba(246,196,90,.12); color: var(--amber); }

  .bottom-nav {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: min(92vw, 390px); height: 68px; padding: 10px 12px 8px;
    border-radius: 22px; background: rgba(7,11,15,.85); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 18px 28px rgba(0,0,0,.32); display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:8px; backdrop-filter: blur(12px);
  }
  .nav-item {
    display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--muted); font-size: 11px; gap:4px; font-weight:700;
  }
  .nav-item .dot { width: 20px; height:20px; border-radius: 6px; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06); display:grid; place-items:center; }
  .nav-item.active { color: var(--ink); }
  .nav-item.active .dot { background: rgba(255,255,255,.12); }
  .nav-item .bell { width: 12px; height: 12px; border:2px solid currentColor; border-top-left-radius: 10px; border-top-right-radius: 10px; border-bottom: 0; position:relative; }
  .nav-item .bell::after { content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:8px; height:8px; border-radius:50%; border:2px solid currentColor; }
  .nav-item .house { width: 13px; height: 13px; border:2px solid currentColor; border-top: 0; border-radius: 2px; position: relative; }
  .nav-item .house::before { content:""; position:absolute; left:50%; top:-9px; transform:translateX(-50%); width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:9px solid currentColor; }
  .nav-item .stats { width: 15px; height: 15px; position:relative; }
  .nav-item .stats::before, .nav-item .stats::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:currentColor; border-radius:3px; }
  .nav-item .stats::before { bottom: 3px; width: 90%; left: 5%; }
  .nav-item .stats::after { bottom: 9px; width: 60%; left: 20%; }
  .nav-item .user { width: 14px; height: 14px; border-radius:50%; border:2px solid currentColor; position:relative; }
  .nav-item .user::after { content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:10px; height:8px; border:2px solid currentColor; border-top:0; border-radius:0 0 8px 8px; }

  @media (max-width: 420px) {
    body { padding: 0; }
    .phone { width:100vw; min-height:100vh; border-radius:0; }
    .bottom-nav { width: calc(100vw - 18px); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="portrait">
      <div class="score-chip">67</div>
      <div class="title-top">
        <div class="date">יום 30, באוקטובר</div>
        <div class="name">ערב, שי</div>
      </div>
      <div class="mic"></div>
      <div class="info-block">
        <div class="q"><strong>אתה רוצה?</strong></div>
        <div class="line">הזמן שלך לא מול היצר, הוא מול ההחלטה.</div>
      </div>
      <div class="warning-box">
        <div class="label">ציון</div>
        <div class="big">67</div>
        <div class="small">בלעדית</div>
      </div>
    </div>

    <div class="panel">
      <div class="mini-card">
        <div class="mini-head">
          <div class="t">מצב</div>
          <div class="v">מושלם</div>
        </div>
        <div class="ring-wrap">
          <div class="left">
            <div class="meta">אחוזי עמידה ב-יום</div>
            <div class="meta">דחיפות: <span style="color:var(--green); font-weight:700;">פעיל</span></div>
          </div>
          <div class="ring"><div class="value">67%</div></div>
        </div>
      </div>

      <div class="mini-card">
        <div class="mini-head">
          <div class="t">מטרות</div>
          <div class="v">היום</div>
        </div>
        <div class="stack">
          <div class="detail">
            <div class="num">6,120/10,000</div>
            <div class="sub">צעדים</div>
          </div>
          <div class="pill green">ממוצע</div>
        </div>
        <div class="stack" style="margin-top:16px;">
          <div class="detail">
            <div class="num">5/12</div>
            <div class="sub">כוסות מים</div>
          </div>
          <div class="pill amber">נכנס</div>
        </div>
      </div>

      <div class="mini-card">
        <div class="mini-head">
          <div class="t">כיוון</div>
          <div class="v">מחר</div>
        </div>
        <div class="stack">
          <div class="detail">
            <div class="num">לאכול נקי</div>
            <div class="sub">ארוחות מסודרות: 0/3</div>
          </div>
          <div class="pill green">כושר</div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item"><div class="dot"><span class="bell"></span></div>תצוגה</div>
      <div class="nav-item"><div class="dot"><span class="house"></span></div>תמונה</div>
      <div class="nav-item active"><div class="dot"><span class="stats"></span></div>היום</div>
      <div class="nav-item"><div class="dot"><span class="stats"></span></div>יעדים</div>
      <div class="nav-item"><div class="dot"><span class="user"></span></div>פרופיל</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
